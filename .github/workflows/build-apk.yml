name: Build KamalScan Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions page

jobs:
  build-android:
    name: Build APK & AAB (Google Play Store)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Native Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Ready for direct phone install)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & AAB (For Google Play Store)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload Debug APK (Direct Install on Android Phones)
        uses: actions/upload-artifact@v4
        with:
          name: KamalScan-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (Upload to Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: KamalScan-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: KamalScan-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
